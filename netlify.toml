[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Generator source and docs live in the publish folder but should not be served.
[[redirects]]
  from = "/site-src/*"
  to = "/404.html"
  status = 404
  force = true
